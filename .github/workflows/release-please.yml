name: release-please

# Keeps a release pull request open, accumulating every conventional
# commit landed on master since the last tag.  Nothing is released until
# that pull request is merged, so what goes in a release stays a
# decision; only the bookkeeping -- the version number, the changelog,
# the tag and the GitHub release -- is automated.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
