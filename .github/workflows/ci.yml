name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e .
      - run: pip install mypy
      - run: mypy src/

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
        # Both halves of the install matter. Without the extras, the
        # flags that need them must refuse cleanly; with them, the code
        # behind those flags must actually work. A test that silently
        # depended on an optional install passed locally and failed here
        # once already.
        install: [bare, extras]
        include:
          # The cache key cannot hold a comma, so the combination is
          # named by a label and the install string comes with it.
          - install: bare
            spec: "."
          - install: extras
            spec: ".[rss,browser]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ matrix.install }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.python-version }}-${{ matrix.install }}-
      - run: pip install -e "${{ matrix.spec }}"
      - run: pip install pytest pytest-asyncio pytest-httpx pytest-cov
      # tests/smoke is its own job below, so a broken build is visible
      # on the run summary instead of buried in this job's log.
      - run: pytest --cov=src/crawlme --cov-fail-under=70 -m "not e2e and not browser" --ignore=tests/smoke

  # Does the assembled system still run at all: a hermetic crawl over a
  # site the test process serves to itself, no network and no LLM spend.
  # One Python version is enough, it checks wiring rather than
  # version compatibility.
  smoke:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-3.12-
      - run: pip install -e .
      - run: pip install pytest pytest-asyncio
      - run: pytest tests/smoke -v
