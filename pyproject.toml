[project]
name = "crawl-me-maybe"
version = "0.4.1"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Xuan Shi" }]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings",
    "httpx",
    "trafilatura",
    "beautifulsoup4",
    "lxml",
    # lxml 6 moved html.clean into its own distribution, and trafilatura
    # still imports it.  Without this a fresh install collects nothing:
    # nine test modules fail on import.  Named here rather than taken
    # via trafilatura[all], which pulls a dozen packages for one module.
    "lxml_html_clean",
    "aiosqlite",
    "litellm>=1.40",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
rss = ["feedparser>=6.0"]

[project.scripts]
crawl = "crawlme.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crawlme"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "BLE", "S", "RUF", "ISC"]
ignore = ["BLE001", "S112", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that hit real websites (skip in CI)",
    "integration: pipeline tests with mocked network",
    "browser: needs a real chromium install (skip in CI)",
]
