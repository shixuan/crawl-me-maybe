[project]
name = "crawl-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings",
    "httpx",
    "trafilatura",
    "beautifulsoup4",
    "lxml",
    "aiosqlite",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crawlme"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "BLE", "S", "RUF", "ISC"]
ignore = ["BLE001", "S112", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
