<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crawl me maybe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <p class="tagline">Hey, I just met you. And this is crazy. But here's my sources. So, </p>
  <h1 class="wordmark">crawl me maybe</h1>
</header>

<main class="layout">

  <aside class="rail">
    <div class="card rail-card">
      <h2 class="card-title">runs</h2>
      <label class="field">
        <span class="field-label">with results only</span>
        <input type="checkbox" id="only-with-results" checked>
      </label>
      <ol id="runs" class="runs"></ol>
    </div>
  </aside>

  <section class="results">
    <div class="card filters">
      <div id="goal-block" class="goal-block" hidden>
        <span class="goal-label">your prompt</span>
        <p id="goal-prompt" class="goal-prompt"></p>
      </div>

      <div class="filter-row">
        <input id="q" class="search" type="search" placeholder="search titles, summaries, fields and page text" autocomplete="off">
      </div>

      <div class="filter-row" id="chips"></div>

      <div class="filter-row meta-row">
        <span id="tally" class="tally"></span>
        <label class="field">
          <span class="field-label">extracted only</span>
          <input type="checkbox" id="only-extracted">
        </label>
        <label class="field">
          <span class="field-label">headline</span>
          <select id="headline" class="select"></select>
        </label>
        <label class="field">
          <span class="field-label">sort</span>
          <select id="sort" class="select">
            <option value="relevance">relevance</option>
            <option value="published">published</option>
            <option value="title">title</option>
          </select>
        </label>
        <select id="goal" class="select" hidden></select>
      </div>
    </div>

    <div id="cards"></div>
    <p id="empty" class="empty" hidden>nothing here. pick another run, or loosen the filters.</p>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
